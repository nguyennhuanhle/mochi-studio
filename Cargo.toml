# Mochi Studio — Cargo workspace
# Phần [workspace.dependencies] và [workspace.lints] được giữ nguyên từ Cap (xem vendor/cap/PROVENANCE.md)
# để các crate vendor build đúng như upstream đã kiểm thử.

[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/*",
    "vendor/cap/crates/*",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/nguyennhuanhle/mochi-studio"

[workspace.dependencies]
anyhow = { version = "1.0.86" }
# This includes a currently-unreleased fix that ensures the audio stream is actually
# stopped and released on drop on macOS, plus zeroing of WASAPI capture
# packets flagged AUDCLNT_BUFFERFLAGS_SILENT (loopback of an idle endpoint
# otherwise surfaces unspecified buffer contents as audio).
cpal = { git = "https://github.com/CapSoftware/cpal", rev = "6013cb5f8bd3" }
ffmpeg = { package = "ffmpeg-next", git = "https://github.com/CapSoftware/rust-ffmpeg", rev = "49db1fede112" }
tokio = { version = "1.39.3", features = [
    "macros",
    "process",
    "fs",
    "sync",
    "rt",
    "rt-multi-thread",
    "time",
] }
# Ghim đúng bộ Tauri Cap đã kiểm thử (2.8.5 / runtime-wry 2.8.1 / wry 0.53.3); bản 2.10+ xung đột dep macOS của Cap
tauri = { version = "=2.8.5", features = ["specta"] }
specta = { version = "=2.0.0-rc.20", features = [
    "derive",
    "serde_json",
    "uuid",
    "chrono"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

nokhwa = { git = "https://github.com/CapSoftware/nokhwa", rev = "b9c8079e82e2", features = [
    "input-native",
    "serialize",
] }
nokhwa-bindings-macos = { git = "https://github.com/CapSoftware/nokhwa", rev = "b9c8079e82e2" }
wgpu = { version = "25.0.0", features = ["wgpu-core"] }
wgpu-hal = "25.0.0"
wgpu-core = "25.0.0"
flume = "0.11.0"
thiserror = "1.0"
sentry = { version = "0.42.0", features = [
    "anyhow",
    "backtrace",
    "debug-images",
] }
tracing = "0.1.41"
futures = "0.3.31"
aho-corasick = "1.1.4"

cidre = { git = "https://github.com/CapSoftware/cidre", rev = "bf84b67079a8", features = [
    "macos_12_7",
    "cv",
    "cf",
    "cg",
    "core_audio",
    "sc",
    "av",
    "blocks",
    "async",
    "dispatch",
    "io_surface",
    "mtl",
    "vt",
    "vn",
], default-features = false }

windows = "0.60.0"
windows-core = "0.60"
windows-sys = "0.59.0"
windows-capture = "1.5.0"
percent-encoding = "2.3.1"
sysinfo = "0.32"

# TODO: Reenable these: https://github.com/CapSoftware/Cap/issues/859
[workspace.lints.rust]
deprecated = "allow"
unexpected_cfgs = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
let_underscore_future = "deny"
unchecked_duration_subtraction = "deny"
collapsible_if = "deny"
clone_on_copy = "deny"
redundant_closure = "deny"
ptr_arg = "deny"
len_zero = "deny"
let_unit_value = "deny"
unnecessary_lazy_evaluations = "deny"
needless_range_loop = "deny"
manual_clamp = "deny"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.dev.package.cap-camera-effects]
opt-level = 2

[profile.dev.package.cap-audio]
opt-level = 2

[profile.release]
panic = "unwind"
codegen-units = 1
lto = "thin"
opt-level = "s"
debug = "line-tables-only"

[patch.crates-io]
cidre = { git = "https://github.com/CapSoftware/cidre", rev = "bf84b67079a8" }
# https://github.com/gfx-rs/wgpu/pull/7550 — bản vá wgpu-hal mà Cap dùng
wgpu-hal = { path = "vendor/wgpu-hal" }
