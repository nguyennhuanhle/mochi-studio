name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues first.
        **Security vulnerabilities:** please report them privately (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click "New recording", choose "Window"…
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording
        - Editor / timeline
        - Preview
        - Export
        - Installer
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mochi Studio version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: "NVIDIA RTX 3060, driver 572.16"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For export problems, attach the newest log from `%LOCALAPPDATA%\studio.mochi.desktop\logs\`.
      render: text
