name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the "Out of scope" list in CONTRIBUTING.md before suggesting a feature.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How should it work from the user's point of view? What should happen when something goes wrong?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Workarounds you use today, or how other tools (Camtasia, Screen Studio…) handle it.
