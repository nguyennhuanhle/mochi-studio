[package]
name = "mochi-recorder"
description = "Dịch vụ quay của Mochi Studio: máy trạng thái, preflight, luật K-R1…K-R5 (bọc cap-recording)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cap-recording = { path = "../../vendor/cap/crates/recording" }
cap-project = { path = "../../vendor/cap/crates/project" }
mochi-project = { path = "../mochi-project" }
cap-camera = { path = "../../vendor/cap/crates/camera" }
scap-targets = { path = "../../vendor/cap/crates/scap-targets" }
scap-cpal = { path = "../../vendor/cap/crates/scap-cpal" }
anyhow = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4"
cpal = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
kameo = "0.17.2"
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "fs", "rt", "macros"] }
tracing = { workspace = true }
uuid = { version = "1.11.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
